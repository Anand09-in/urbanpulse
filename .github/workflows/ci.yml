name: CI checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write    # needed for OIDC
  contents: read

jobs:

  # ── Job 1: Python tests + DAG validation ──────────────────────────
  python-checks:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements-test.txt') }}

      - name: Install dependencies
        run: pip install -r requirements-test.txt pytest --quiet

      - name: Run Lambda unit tests
        run: pytest ingestion/tests/ -v --tb=short

      - name: Validate DAG syntax
        run: |
          python -c "
          import ast, sys, os
          errors = []
          for f in os.listdir('dags'):
              if not f.endswith('.py'): continue
              try:
                  ast.parse(open(f'dags/{f}').read())
                  print(f'  OK  {f}')
              except SyntaxError as e:
                  errors.append(f'  FAIL {f}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('All DAGs valid')
          "

  # ── Job 2: dbt compile check ───────────────────────────────────────
  dbt-checks:
    name: dbt compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Install dbt
        run: pip install dbt-athena-community --quiet

      - name: dbt deps
        run: cd dbt/urbanpulse && dbt deps --profiles-dir .

      - name: dbt compile (syntax check only)
        run: |
          cd dbt/urbanpulse
          dbt compile --profiles-dir .

  # ── Job 3: Terraform validate + security scan ──────────────────────
  terraform-checks:
    name: Terraform validate + tfsec
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_profile: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Write EC2 public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PUBLIC_KEY }}" > ~/.ssh/urbanpulse_ci.pub

      - name: Terraform init
        run: cd infra && terraform init

      - name: Terraform validate
        run: cd infra && terraform validate

      - name: Terraform plan (show what would change)
        run: |
          cd infra
          terraform plan \
            -var="my_ip_cidr=10.0.0.0/32" \
            -var="github_username=${{ github.repository_owner }}" \
            -out=tfplan
        continue-on-error: false

      - name: Upload tfplan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1